<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HireFlow - 招聘流程协作平台</title>

    <style>
      html,
      body,
      #app {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      .hireflow-loading {
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        min-height: 100vh;
        color: #303133;
        font-family: Inter, 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif;
        background: #f5f7fb;
      }

      .hireflow-loading__brand {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 52px;
        height: 52px;
        margin-bottom: 14px;
        color: #fff;
        font-size: 17px;
        font-weight: 700;
        letter-spacing: -0.5px;
        background: #2254f4;
        border-radius: 14px;
        box-shadow: 0 8px 24px rgba(34, 84, 244, 0.18);
      }

      .hireflow-loading__content {
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .hireflow-loading__content strong {
        font-size: 20px;
        line-height: 1.4;
      }

      .hireflow-loading__content span {
        margin-top: 4px;
        color: #909399;
        font-size: 12px;
      }

      .hireflow-loading__spinner {
        width: 22px;
        height: 22px;
        margin-top: 26px;
        border: 2px solid rgba(34, 84, 244, 0.16);
        border-top-color: #2254f4;
        border-radius: 50%;
        animation: hireflow-spin 0.8s linear infinite;
      }

      .hireflow-loading p {
        margin: 10px 0 0;
        color: #909399;
        font-size: 12px;
      }

      @keyframes hireflow-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="hireflow-loading">
        <div class="hireflow-loading__brand">HF</div>

        <div class="hireflow-loading__content">
          <strong>HireFlow</strong>
          <span>招聘流程协作平台</span>
        </div>

        <div class="hireflow-loading__spinner"></div>

        <p>正在加载工作台...</p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
